services:
  - type: web
    name: nfl-matchup-intelligence
    runtime: python
    plan: free
    buildCommand: python -m compileall -q .
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: NFL_SEASON
        value: "2026"
      - key: CACHE_SECONDS
        value: "21600"
